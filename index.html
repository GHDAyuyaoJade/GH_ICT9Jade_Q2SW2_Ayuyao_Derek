<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms and Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" alt="OBMC Logo" height="50px" width="50px" class="rounded-circle">
            </a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Homepage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-3 border border-2 border-primary rounded p-3" style="text-align: center;">
        <h2>Contact Us</h2>
        <form>
            <div class="mb-3 mt-3">
                <label for="fullname">Full Name</label><br>
                <input class="form-control" type="text" name="fullname" id="fullname" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
                <label for="email">Email Address</label><br>
                <input class="form-control" type="email" name="email" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="subject">Subject</label><br>
                <input class="form-control" type="text" name="subject" id="subject" placeholder="Enter subject">
            </div>
            <div class="mb-3">
                <label for="message">Message</label><br>
                <textarea class="form-control" name="message" id="message" placeholder="Type your message here" cols="50" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary form-control">Send Message</button>
            </div>
        </form>
    </div>
    <footer class="bg-dark py-5" data-bs-theme="dark">
        <div class="container">
            <div class="row">
                <div class="col-sm-4">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10" alt="OBMC Logo" height="200px" width="200px" class="rounded-circle">
                </div>
                <div class="col-sm-4 text-white">
                    <h3>Location</h3>
                    <ul>
                        <li>Angeles City, Pampanga</li>
                        <li>Fairview, Quezon City</li>
                        <li>Greenhills, San Juan City</li>
                        <li>B.F. Homes, Las Piñas City</li>
                        <li>Sta. Ana, Manila City</li>
                    </ul>
                </div>
                <div class="col-sm-4 text-white">
                    <h3>Contact Us</h3>
                    <ul>
                        <li>+63 2 8722 9720 to 26</li>
                        <li>info@obmontessori.edu.ph</li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
